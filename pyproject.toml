# Formatter and linter config. `ruff` replaces black + flake8 + isort with one
# tool: its formatter is a drop-in for black, so style is unchanged.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# F  pyflakes      — undefined names, dead imports, dead locals
# I  isort         — import order
# UP pyupgrade     — current-version idioms
# B  bugbear       — real bug shapes
# SIM simplify
select = ["F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A test nests `with` when each context is a separate arrangement step, and
# reads worse as one statement; and it opens a file to hand the handle straight
# to the code under test, which is what the test is checking.
"tests/*" = ["SIM117", "SIM115"]
# The adapter facade imports these so tests can patch THROUGH it
# (`aws.subprocess`); they are re-exports, not unused imports.
"atlas_ctl_adapter_aws/__init__.py" = ["F401"]
